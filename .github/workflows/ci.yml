name: router_eval CI

# Runs the offline replay skeleton + tests on the synthetic fixture only.
# No network, no pandas/datasets — must stay green on a clean checkout.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest (fixture path needs no other deps)
        run: python -m pip install --upgrade pip pytest
      - name: Run the fixture replay end-to-end (Phase 1 + Part A)
        run: python -m router_eval.replay
      - name: Phase 2 dry-run smoke on the PII-free sample traffic
        run: python -m router_eval.phase2 --traffic router_eval/phase2/fixtures/traffic_sample.jsonl
      - name: Run tests (Part A + Phase 2, all offline)
        run: python -m pytest router_eval/ -q
